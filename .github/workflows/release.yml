name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            browsers: chrome chromium brave edge vivaldi opera helium
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            browsers: chrome chromium brave edge vivaldi opera arc helium
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            browsers: chrome chromium brave edge vivaldi opera arc helium
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          mkdir dist
          for browser in ${{ matrix.browsers }}; do
            cargo build --release --target ${{ matrix.target }} --no-default-features --features "$browser"
            cp "target/${{ matrix.target }}/release/chromium-profile-picker${{ matrix.ext }}" \
              "dist/chromium-profile-picker-$browser-${{ matrix.target }}${{ matrix.ext }}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: chromium-profile-picker-${{ matrix.target }}
          path: dist/*

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
